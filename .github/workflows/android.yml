name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # El runner ubuntu-latest ya trae el Android SDK preinstalado ($ANDROID_HOME);
      # setup-android@v3 falla porque intenta instalar el paquete obsoleto "tools".
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up signing keystore
        # Decodifica el keystore fijo (secreto SIGNING_KEYSTORE_BASE64) y crea
        # keystore.properties para que build.gradle.kts firme el build debug
        # con la llave fija (signing config "githubPublish"). Sin esto, el
        # runner firmaría con una llave debug efímera distinta en cada run.
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/elanticristo616.keystore"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/elanticristo616.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF

      - name: Build debug APK
        run: ./gradlew :app:assembleGenericDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElAntiCristo616App-debug
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error
